<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animae ref client</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        line-height: 1.4;
      }
      body {
        margin: 1rem;
        max-width: 52rem;
      }
      #log {
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        border: 1px solid #ccc;
        padding: 0.5rem;
        min-height: 8rem;
        max-height: 40vh;
        overflow: auto;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      input[type="text"] {
        flex: 1;
        min-width: 12rem;
      }
    </style>
  </head>
  <body>
    <h1>Animae ref client</h1>
    <p>Minimal WebSocket UI for protocol smoke tests (locale + snapshot).</p>
    <div class="row">
      <label>UI locale
        <select id="locale">
          <option value="en">en</option>
          <option value="zh-CN">zh-CN</option>
        </select>
      </label>
      <button type="button" id="connect">Connect</button>
      <span id="status">disconnected</span>
    </div>
    <div class="row">
      <input id="input" type="text" placeholder="Player input (controller)" />
      <button type="button" id="send">Send input</button>
    </div>
    <pre id="header">—</pre>
    <div id="log"></div>
    <script>
      const qs = new URLSearchParams(location.search);
      const wsUrl = qs.get("ws") || `ws://${location.host}/ws`;
      const token = qs.get("token") || "";
      const clientId = localStorage.getItem("animae.clientId") || `ref-${crypto.randomUUID().slice(0, 8)}`;
      localStorage.setItem("animae.clientId", clientId);

      let ws;
      let seq = 0;
      let req = 0;

      const logEl = document.getElementById("log");
      const statusEl = document.getElementById("status");
      const headerEl = document.getElementById("header");
      const localeEl = document.getElementById("locale");

      function log(line) {
        logEl.textContent = `${logEl.textContent}${line}\n`;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function nextId() {
        req += 1;
        return `r${req}`;
      }

      function send(msg) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify(msg));
      }

      function hello() {
        send({
          v: 1,
          type: "hello",
          role: "controller",
          clientId,
          locale: localeEl.value,
          token: token || undefined,
        });
      }

      localeEl.addEventListener("change", () => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        send({ v: 1, type: "set_locale", id: nextId(), locale: localeEl.value });
      });

      document.getElementById("connect").addEventListener("click", () => {
        if (ws) ws.close();
        logEl.textContent = "";
        ws = new WebSocket(wsUrl);
        statusEl.textContent = "connecting…";
        ws.onopen = () => {
          statusEl.textContent = "connected";
          hello();
        };
        ws.onclose = () => {
          statusEl.textContent = "disconnected";
        };
        ws.onmessage = (ev) => {
          const m = JSON.parse(ev.data);
          if (typeof m.seq === "number" && m.seq > seq) seq = m.seq;
          if (m.type === "hello_ok") {
            localeEl.value = m.locale || localeEl.value;
            log(`hello_ok locale=${m.locale}`);
          }
          if (m.type === "locale") {
            localeEl.value = m.locale;
            log(`locale ack ${m.locale}`);
          }
          if (m.type === "snapshot" && m.state?.header?.time?.label) {
            headerEl.textContent = m.state.header.time.label;
          }
          if (m.type === "error") {
            log(`error ${m.code}: ${m.message}`);
          }
          if (m.type === "result") {
            log(`result ${m.id} ok=${m.ok}`);
          }
        };
      });

      document.getElementById("send").addEventListener("click", () => {
        const text = document.getElementById("input").value.trim();
        if (!text) return;
        send({ v: 1, type: "input", id: nextId(), text });
      });
    </script>
  </body>
</html>
